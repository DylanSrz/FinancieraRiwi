name: Épica
description: Agrupa historias de usuario con un objetivo común.
title: "[EX] "
labels: ["tipo: epica"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
    validations:
      required: true
  - type: textarea
    id: exito
    attributes:
      label: Criterio de éxito
    validations:
      required: true
  - type: textarea
    id: historias
    attributes:
      label: Historias / tareas
      description: Se gestionan como sub-issues de esta épica.
      value: |
        - [ ] HU-XX ...
