# Servicios locales para desarrollo. Uso: docker compose up -d
# PostgreSQL queda en localhost:5433 (no choca con un PostgreSQL instalado en el 5432).
#   - nomina       → base de desarrollo (backend/.env)
#   - nomina_test  → base de las pruebas e2e (se vacía en cada ejecución)
name: financiera-riwi

services:
  db:
    image: postgres:17-alpine
    container_name: financiera-riwi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nomina
      TZ: America/Bogota
    ports:
      - '5433:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nomina']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres:
